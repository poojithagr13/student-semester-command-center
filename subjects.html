<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subjects | Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Back to Dashboard -->
        <a href="index.html" class="back-link">
            ← Back to Dashboard
        </a>


        <!-- Page Header -->
        <h1>Subjects</h1>

        <p class="subtitle">
            Manage your semester subjects and access their academic resources.
        </p>


        <!-- Add Subject -->
        <div class="add-form">

            <h2>Add Subject</h2>

            <div class="form-group">

                <label for="subjectInput">
                    Subject name
                </label>

                <input
                    type="text"
                    id="subjectInput"
                    placeholder="Enter subject name"
                    autocomplete="off"
                >

            </div>

            <button onclick="addSubject()">
                Add Subject
            </button>

        </div>


        <!-- Subject List -->
        <section>

            <h2>Your Subjects</h2>

            <div id="subjectList" class="subject-list"></div>

        </section>

    </main>


    <script>

        /* ==========================================
           DEFAULT SUBJECTS
           ========================================== */

        const defaultSubjects = [
            "Statistics and Probability",
            "Data Structures and its Applications",
            "Python for Data Science",
            "Operating System",
            "Digital Design and Computer Organization",
            "Foundations of Artificial Intelligence"
        ];


        /* ==========================================
           LOAD SUBJECTS
           ========================================== */

        let subjects =
            JSON.parse(
                localStorage.getItem("studentSubjects")
            ) || [];


        /* Add missing default subjects */

        defaultSubjects.forEach(subject => {

            if (!subjects.includes(subject)) {
                subjects.unshift(subject);
            }

        });


        localStorage.setItem(
            "studentSubjects",
            JSON.stringify(subjects)
        );


        /* ==========================================
           DISPLAY SUBJECTS
           ========================================== */

        function displaySubjects() {

            const subjectList =
                document.getElementById("subjectList");


            subjectList.innerHTML = "";


            if (subjects.length === 0) {

                subjectList.innerHTML = `
                    <div class="empty-message">
                        No subjects added yet.
                    </div>
                `;

                return;
            }


            subjects.forEach((subject, index) => {

                const item =
                    document.createElement("div");

                item.className = "subject-item";


                const content =
                    document.createElement("div");


                const title =
                    document.createElement("h3");

                title.textContent = subject;


                const description =
                    document.createElement("p");

                description.textContent =
                    "Open subject resources";


                content.appendChild(title);
                content.appendChild(description);


                const actions =
                    document.createElement("div");

                actions.style.display = "flex";
                actions.style.gap = "8px";


                /* Open button */

                const openButton =
                    document.createElement("button");

                openButton.textContent =
                    "Open Subject";


                openButton.onclick = function () {
                    openSubject(subject);
                };


                actions.appendChild(openButton);


                /* Delete button */

                if (!defaultSubjects.includes(subject)) {

                    const deleteButton =
                        document.createElement("button");

                    deleteButton.textContent =
                        "Delete";

                    deleteButton.className =
                        "delete-btn";


                    deleteButton.onclick =
                        function () {

                            deleteSubject(index);

                        };


                    actions.appendChild(deleteButton);
                }


                item.appendChild(content);
                item.appendChild(actions);

                subjectList.appendChild(item);

            });

        }


        /* ==========================================
           ADD SUBJECT
           ========================================== */

        function addSubject() {

            const input =
                document.getElementById("subjectInput");


            const subject =
                input.value.trim();


            if (subject === "") {

                alert(
                    "Please enter a subject name."
                );

                return;
            }


            if (subjects.includes(subject)) {

                alert(
                    "This subject already exists."
                );

                return;
            }


            subjects.push(subject);


            localStorage.setItem(
                "studentSubjects",
                JSON.stringify(subjects)
            );


            input.value = "";


            displaySubjects();

        }


        /* ==========================================
           DELETE SUBJECT
           ========================================== */

        function deleteSubject(index) {

            const subject =
                subjects[index];


            if (defaultSubjects.includes(subject)) {

                alert(
                    "Default subjects cannot be deleted."
                );

                return;
            }


            const confirmed =
                confirm(
                    `Delete "${subject}"?`
                );


            if (!confirmed) {
                return;
            }


            subjects.splice(index, 1);


            localStorage.setItem(
                "studentSubjects",
                JSON.stringify(subjects)
            );


            displaySubjects();

        }


        /* ==========================================
           OPEN SUBJECT
           ========================================== */

        function openSubject(subject) {

            window.location.href =
                "subject-details.html?name=" +
                encodeURIComponent(subject);

        }


        /* ==========================================
           ENTER KEY SUPPORT
           ========================================== */

        document
            .getElementById("subjectInput")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {
                        addSubject();
                    }

                }
            );


        /* ==========================================
           INITIAL DISPLAY
           ========================================== */

        displaySubjects();

    </script>

</body>

</html>
