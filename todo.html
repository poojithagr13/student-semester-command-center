<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List | Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="container">

        <!-- Back to Dashboard -->
        <a href="index.html" class="back-link">
            ← Back to Dashboard
        </a>


        <!-- Page Header -->
        <h1>To-Do List</h1>

        <p class="subtitle">
            Keep track of the academic tasks you still need to complete.
        </p>


        <!-- Add Task -->
        <div class="add-form">

            <h2>Add Task</h2>

            <div class="form-group">

                <label for="taskInput">
                    Task
                </label>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task"
                    autocomplete="off"
                >

            </div>

            <button onclick="addTask()">
                Add Task
            </button>

        </div>


        <!-- Pending Tasks -->
        <section>

            <h2>Pending Tasks</h2>

            <div
                id="taskList"
                class="todo-list"
            ></div>

        </section>

    </main>


    <script>

        /* ==========================================
           SUPABASE
           ========================================== */

        const SUPABASE_URL =
            "https://bjfccfveekebgbkqreyp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           GET CURRENT USER
           ========================================== */

        async function getCurrentUser() {

            const {
                data,
                error
            } = await supabaseClient.auth.getUser();


            if (error || !data.user) {

                window.location.href =
                    "login.html";

                return null;
            }


            return data.user;

        }


        /* ==========================================
           LOAD TASKS
           ========================================== */

        async function loadTasks() {

            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                data: tasks,
                error
            } = await supabaseClient
                .from("todos")
                .select("*")
                .eq("user_id", user.id)
                .eq("completed", false)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Error loading tasks:",
                    error
                );

                document.getElementById(
                    "taskList"
                ).innerHTML = `
                    <div class="empty-message">
                        Unable to load your tasks.
                    </div>
                `;

                return;
            }


            displayTasks(tasks || []);

        }


        /* ==========================================
           DISPLAY TASKS
           ========================================== */

        function displayTasks(tasks) {

            const taskList =
                document.getElementById(
                    "taskList"
                );


            taskList.innerHTML = "";


            if (tasks.length === 0) {

                taskList.innerHTML = `
                    <div class="empty-message">
                        No pending tasks.
                    </div>
                `;

                return;
            }


            tasks.forEach(task => {

                const item =
                    document.createElement("div");

                item.className =
                    "todo-item";


                /* Task text */

                const taskText =
                    document.createElement("p");

                taskText.textContent =
                    task.task;


                /* Actions */

                const actions =
                    document.createElement("div");

                actions.className =
                    "todo-actions";


                /* Complete */

                const completeButton =
                    document.createElement("button");

                completeButton.textContent =
                    "Complete";


                completeButton.className =
                    "success-btn";


                completeButton.onclick =
                    function () {

                        toggleTask(
                            task.id,
                            true
                        );

                    };


                /* Delete */

                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent =
                    "Delete";


                deleteButton.className =
                    "delete-btn";


                deleteButton.onclick =
                    function () {

                        deleteTask(task.id);

                    };


                actions.appendChild(
                    completeButton
                );

                actions.appendChild(
                    deleteButton
                );


                item.appendChild(
                    taskText
                );

                item.appendChild(
                    actions
                );


                taskList.appendChild(
                    item
                );

            });

        }


        /* ==========================================
           ADD TASK
           ========================================== */

        async function addTask() {

            const input =
                document.getElementById(
                    "taskInput"
                );


            const task =
                input.value.trim();


            if (task === "") {

                alert(
                    "Please enter a task."
                );

                return;
            }


            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                error
            } = await supabaseClient
                .from("todos")
                .insert([
                    {
                        user_id: user.id,
                        task: task,
                        completed: false
                    }
                ]);


            if (error) {

                console.error(
                    "Error adding task:",
                    error
                );

                alert(
                    "Unable to add task."
                );

                return;
            }


            input.value = "";


            loadTasks();

        }


        /* ==========================================
           COMPLETE / TOGGLE TASK
           ========================================== */

        async function toggleTask(
            taskId,
            completed
        ) {

            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                error
            } = await supabaseClient
                .from("todos")
                .update({
                    completed: completed
                })
                .eq("id", taskId)
                .eq("user_id", user.id);


            if (error) {

                console.error(
                    "Error updating task:",
                    error
                );

                alert(
                    "Unable to update task."
                );

                return;
            }


            loadTasks();

        }


        /* ==========================================
           DELETE TASK
           ========================================== */

        async function deleteTask(taskId) {

            const confirmed =
                confirm(
                    "Delete this task?"
                );


            if (!confirmed) {
                return;
            }


            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                error
            } = await supabaseClient
                .from("todos")
                .delete()
                .eq("id", taskId)
                .eq("user_id", user.id);


            if (error) {

                console.error(
                    "Error deleting task:",
                    error
                );

                alert(
                    "Unable to delete task."
                );

                return;
            }


            loadTasks();

        }


        /* ==========================================
           ENTER KEY SUPPORT
           ========================================== */

        document
            .getElementById("taskInput")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {
                        addTask();
                    }

                }
            );


        /* ==========================================
           INITIAL LOAD
           ========================================== */

        loadTasks();

    </script>

</body>

</html>
