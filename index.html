<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Semester Command Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
  // Protect the page - redirect to login if not logged in
  if (!localStorage.getItem('studentName')) {
    window.location.href = 'login.html';
  }
</script>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #1e3a8a; color: white;">
  <div>
    Welcome, <strong id="userName"></strong>
  </div>
  <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">
    Logout
  </button>
</div>

<script>
  // Show the user's name
  document.getElementById('userName').textContent = localStorage.getItem('studentName') || 'Student';

  function logout() {
    localStorage.removeItem('studentName');
    localStorage.removeItem('studentPassword');
    window.location.href = 'login.html';
  }
</script>

    <div class="dashboard">

    <h1>Student Semester Command Center</h1>
    <nav style="margin: 15px 0;">
        <a href="topics.html" style="color: white; text-decoration: none; background: #2563eb; padding: 8px 16px; border-radius: 5px;">Go to Topics</a>
    </nav>
    <p>Welcome to your academic dashboard.</p>

    
    <div class="cards">
        <div class="card" onclick="window.location.href='subjects.html'" style="cursor: pointer;">
            <h2>📚 Subjects</h2>
            <p id="subjectCount">0</p>
            <button onclick="event.stopPropagation(); window.location.href='subjects.html'">
                Manage Subjects
            </button>
        </div>
               
        <div class="card">
            <h2>📖 Topics</h2>
            <p id="topicCount">0</p>
        </div>

        <div class="card">
            <h2>📝 Questions</h2>
            <p id="topicCount">0</p>
        </div>

       <div class="card">
    <h2>📊 Overall Progress</h2>
    <p id="overallProgress">0%</p>
</div>
    </div>

</div>
<script>
    // Load subjects from localStorage
    let subjects = JSON.parse(localStorage.getItem("studentSubjects")) || [];
    let topics = JSON.parse(localStorage.getItem("studentTopics")) || [];

    // Update the count on the page
    function updateSubjectCount() {
        document.getElementById("subjectCount").textContent = subjects.length;
        document.getElementById("topicCount").textContent = topics.length;
    }

    // Add a new subject
    function addSubject() {
        const subject = prompt("Enter your subject name:");

        if (subject && subject.trim() !== "") {
            // Avoid adding empty or duplicate names
            const name = subject.trim();

            if (subjects.includes(name)) {
                alert("This subject already exists!");
                return;
            }

            subjects.push(name);
            localStorage.setItem("studentSubjects", JSON.stringify(subjects));
            updateSubjectCount();
        }
    }

    // Show the correct count when page loads
    updateSubjectCount();
    </script>


    


</body>
</html>
