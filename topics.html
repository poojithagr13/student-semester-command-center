<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Progress | Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="container">

        <!-- Back to Dashboard -->
        <a href="index.html" class="back-link">
            ← Back to Dashboard
        </a>


        <!-- Page Header -->
        <h1>Progress Management</h1>

        <p class="subtitle">
            Track your learning progress across subjects and topics.
        </p>


        <!-- Add Topic -->
        <div class="add-form">

            <h2>Add Topic</h2>


            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <select id="subject">

                    <option value="">
                        Select subject
                    </option>

                    <option value="Statistics and Probability">
                        Statistics and Probability
                    </option>

                    <option value="Data Structures and its Applications">
                        Data Structures and its Applications
                    </option>

                    <option value="Python for Data Science">
                        Python for Data Science
                    </option>

                    <option value="Operating System">
                        Operating System
                    </option>

                    <option value="Digital Design and Computer Organization">
                        Digital Design and Computer Organization
                    </option>

                    <option value="Foundations of Artificial Intelligence">
                        Foundations of Artificial Intelligence
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="topic">
                    Topic
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="Enter topic name"
                >

            </div>


            <div class="form-group">

                <label for="unit">
                    Unit
                </label>

                <input
                    type="text"
                    id="unit"
                    placeholder="Example: Unit 1"
                >

            </div>


            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="Not Started">
                        Not Started
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>


            <button onclick="addTopic()">
                Add Topic
            </button>

        </div>


        <!-- Progress List -->
        <section>

            <h2>Your Topics</h2>

            <div
                id="topicList"
                class="topic-list"
            ></div>

        </section>

    </main>


    <script>

        /* ==========================================
           SUPABASE
           ========================================== */

        const SUPABASE_URL =
            "https://bjfccfveekebgbkqreyp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           GET CURRENT USER
           ========================================== */

        async function getCurrentUser() {

            const {
                data,
                error
            } = await supabaseClient.auth.getUser();


            if (error || !data.user) {

                window.location.href =
                    "login.html";

                return null;
            }


            return data.user;

        }


        /* ==========================================
           LOAD TOPICS
           ========================================== */

        async function loadTopics() {

            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                data: topics,
                error
            } = await supabaseClient
                .from("topics")
                .select("*")
                .eq("user_id", user.id)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Error loading topics:",
                    error
                );

                document.getElementById(
                    "topicList"
                ).innerHTML = `
                    <div class="empty-message">
                        Unable to load your topics.
                    </div>
                `;

                return;
            }


            displayTopics(
                topics || []
            );

        }


        /* ==========================================
           DISPLAY TOPICS
           ========================================== */

        function displayTopics(topics) {

            const topicList =
                document.getElementById(
                    "topicList"
                );


            topicList.innerHTML = "";


            if (topics.length === 0) {

                topicList.innerHTML = `
                    <div class="empty-message">
                        No topics added yet.
                    </div>
                `;

                return;
            }


            topics.forEach(topic => {

                const item =
                    document.createElement("div");

                item.className =
                    "topic-item";


                /* Topic title */

                const title =
                    document.createElement("h3");

                title.textContent =
                    topic.topic;


                /* Subject */

                const subject =
                    document.createElement("p");

                subject.innerHTML =
                    "<strong>Subject:</strong> " +
                    escapeHTML(
                        topic.subject
                    );


                /* Unit */

                const unit =
                    document.createElement("p");

                unit.innerHTML =
                    "<strong>Unit:</strong> " +
                    escapeHTML(
                        topic.unit
                    );


                /* Status */

                const status =
                    document.createElement("p");

                status.innerHTML =
                    "<strong>Status:</strong> " +
                    escapeHTML(
                        topic.status
                    );


                /* Progress */

                let progress = 0;


                if (topic.status === "In Progress") {
                    progress = 50;
                }


                if (topic.status === "Completed") {
                    progress = 100;
                }


                const progressContainer =
                    document.createElement("div");

                progressContainer.className =
                    "progress-container";


                const progressBar =
                    document.createElement("div");

                progressBar.className =
                    "progress-bar";


                progressBar.style.width =
                    progress + "%";


                progressContainer.appendChild(
                    progressBar
                );


                const progressText =
                    document.createElement("div");

                progressText.className =
                    "progress-text";


                progressText.textContent =
                    progress + "% complete";


                /* Actions */

                const actions =
                    document.createElement("div");

                actions.style.marginTop =
                    "16px";


                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent =
                    "Delete Topic";

                deleteButton.className =
                    "delete-btn";


                deleteButton.onclick =
                    function () {

                        deleteTopic(
                            topic.id
                        );

                    };


                actions.appendChild(
                    deleteButton
                );


                /* Build card */

                item.appendChild(title);
                item.appendChild(subject);
                item.appendChild(unit);
                item.appendChild(status);

                item.appendChild(
                    progressContainer
                );

                item.appendChild(
                    progressText
                );

                item.appendChild(actions);


                topicList.appendChild(item);

            });

        }


        /* ==========================================
           ADD TOPIC
           ========================================== */

        async function addTopic() {

            const subject =
                document
                    .getElementById("subject")
                    .value;


            const topic =
                document
                    .getElementById("topic")
                    .value
                    .trim();


            const unit =
                document
                    .getElementById("unit")
                    .value
                    .trim();


            const status =
                document
                    .getElementById("status")
                    .value;


            if (!subject || !topic || !unit) {

                alert(
                    "Please fill in all fields."
                );

                return;
            }


            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                error
            } = await supabaseClient
                .from("topics")
                .insert([
                    {
                        user_id: user.id,
                        subject: subject,
                        topic: topic,
                        unit: unit,
                        status: status
                    }
                ]);


            if (error) {

                console.error(
                    "Error adding topic:",
                    error
                );

                alert(
                    "Unable to add topic."
                );

                return;
            }


            document.getElementById(
                "topic"
            ).value = "";


            document.getElementById(
                "unit"
            ).value = "";


            document.getElementById(
                "status"
            ).value = "Not Started";


            loadTopics();

        }


        /* ==========================================
           DELETE TOPIC
           ========================================== */

        async function deleteTopic(topicId) {

            const confirmed =
                confirm(
                    "Delete this topic?"
                );


            if (!confirmed) {
                return;
            }


            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                error
            } = await supabaseClient
                .from("topics")
                .delete()
                .eq("id", topicId)
                .eq("user_id", user.id);


            if (error) {

                console.error(
                    "Error deleting topic:",
                    error
                );

                alert(
                    "Unable to delete topic."
                );

                return;
            }


            loadTopics();

        }


        /* ==========================================
           ESCAPE HTML
           ========================================== */

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value;

            return div.innerHTML;

        }


        /* ==========================================
           INITIAL LOAD
           ========================================== */

        loadTopics();

    </script>

</body>

</html>
