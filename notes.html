<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes | Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="container">

        <!-- Back to Subject -->
        <a href="#" id="backLink" class="back-link">
            ← Back to Subject
        </a>


        <!-- Page Header -->
        <h1 id="subjectTitle">
            Notes
        </h1>

        <p class="subtitle">
            Add and access study notes for this subject.
        </p>


        <!-- Add Note -->
        <div class="add-form">

            <h2>Add Note</h2>

            <div class="form-group">

                <label for="title">
                    Note Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter note title"
                >

            </div>


            <div class="form-group">

                <label for="details">
                    Details
                </label>

                <textarea
                    id="details"
                    placeholder="Enter a short description or details"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="file">
                    Note File
                </label>

                <input
                    type="file"
                    id="file"
                    accept=".pdf,image/*"
                >

            </div>


            <button onclick="addNote()">
                Add Note
            </button>

        </div>


        <!-- Notes List -->
        <section>

            <h2>Available Notes</h2>

            <div
                id="notesList"
                class="resource-list"
            ></div>

        </section>

    </main>


    <script>

        /* ==========================================
           SUPABASE
           ========================================== */

        const SUPABASE_URL =
            "https://bjfccfveekebgbkqreyp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           GET SUBJECT
           ========================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const subject =
            params.get("name");


        const subjectTitle =
            document.getElementById("subjectTitle");


        if (subject) {

            subjectTitle.textContent =
                subject + " — Notes";

        } else {

            subjectTitle.textContent =
                "Notes";

        }


        /* ==========================================
           BACK LINK
           ========================================== */

        const backLink =
            document.getElementById("backLink");


        if (subject) {

            backLink.href =
                "subject-details.html?name=" +
                encodeURIComponent(subject);

        } else {

            backLink.href =
                "subjects.html";

        }


        /* ==========================================
           ADD NOTE
           ========================================== */

        async function addNote() {

            if (!subject) {

                alert(
                    "No subject was selected."
                );

                return;
            }


            const title =
                document
                    .getElementById("title")
                    .value
                    .trim();


            const details =
                document
                    .getElementById("details")
                    .value
                    .trim();


            const fileInput =
                document.getElementById("file");


            const file =
                fileInput.files[0];


            if (!title || !details || !file) {

                alert(
                    "Please fill in all fields and select a file."
                );

                return;
            }


            /* ------------------------------------------
               Upload file
               ------------------------------------------ */

            const fileName =
                Date.now() +
                "_" +
                file.name;


            const {
                error: uploadError
            } = await supabaseClient
                .storage
                .from("notes-files")
                .upload(
                    fileName,
                    file
                );


            if (uploadError) {

                console.error(
                    "File upload error:",
                    uploadError
                );

                alert(
                    "Unable to upload the note file."
                );

                return;
            }


            /* ------------------------------------------
               Get public URL
               ------------------------------------------ */

            const {
                data: publicData
            } = supabaseClient
                .storage
                .from("notes-files")
                .getPublicUrl(fileName);


            const fileUrl =
                publicData.publicUrl;


            /* ------------------------------------------
               Save note
               ------------------------------------------ */

            const {
                error: insertError
            } = await supabaseClient
                .from("notes")
                .insert([
                    {
                        subject: subject,
                        title: title,
                        details: details,
                        file_url: fileUrl
                    }
                ]);


            if (insertError) {

                console.error(
                    "Database error:",
                    insertError
                );

                alert(
                    "File uploaded, but the note could not be saved."
                );

                return;
            }


            alert(
                "Note added successfully."
            );


            document.getElementById(
                "title"
            ).value = "";


            document.getElementById(
                "details"
            ).value = "";


            fileInput.value = "";


            loadNotes();

        }


        /* ==========================================
           LOAD NOTES
           ========================================== */

        async function loadNotes() {

            if (!subject) {

                document.getElementById(
                    "notesList"
                ).innerHTML = `
                    <div class="empty-message">
                        No subject selected.
                    </div>
                `;

                return;
            }


            const {
                data,
                error
            } = await supabaseClient
                .from("notes")
                .select("*")
                .eq("subject", subject)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Error loading notes:",
                    error
                );

                document.getElementById(
                    "notesList"
                ).innerHTML = `
                    <div class="empty-message">
                        Unable to load notes.
                    </div>
                `;

                return;
            }


            const notesList =
                document.getElementById(
                    "notesList"
                );


            notesList.innerHTML = "";


            if (!data || data.length === 0) {

                notesList.innerHTML = `
                    <div class="empty-message">
                        No notes available for this subject yet.
                    </div>
                `;

                return;
            }


            data.forEach(note => {

                const card =
                    document.createElement("div");

                card.className =
                    "resource-card";


                const title =
                    document.createElement("h3");

                title.textContent =
                    note.title;


                const details =
                    document.createElement("p");

                details.textContent =
                    note.details || "No details provided.";


                const fileLink =
                    document.createElement("a");

                fileLink.href =
                    note.file_url;

                fileLink.target =
                    "_blank";

                fileLink.rel =
                    "noopener noreferrer";

                fileLink.textContent =
                    "Open Note";


                card.appendChild(title);
                card.appendChild(details);
                card.appendChild(fileLink);


                notesList.appendChild(card);

            });

        }


        /* ==========================================
           INITIAL LOAD
           ========================================== */

        loadNotes();

    </script>

</body>

</html>
