<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Semester Command Center</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-box {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 8px;
      color: #1e3a8a;
    }

    .login-box p {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background: #1e40af;
    }

    .error {
      color: #dc2626;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-box">
    <h2>Student Login</h2>
    <p>ISE 3rd Semester Command Center</p>

    <div class="input-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email">
    </div>
  
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password" required>
    </div>

    <button class="login-btn" onclick="login()">Login / Register</button>
    <p class="error" id="errorMsg">Please fill both fields</p>
  </div>

  <script>
    const SUPABASE_URL = "https://bjfccfveekebgbkqreyp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
    // Check if already logged in
    if (localStorage.getItem('studentName')) {
      window.location.href = 'index.html';
    }

    async function login() {

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      if (!name || !email || !password) {
        errorMsg.textContent = 'Please enter your name, email and password.';
        errorMsg.style.display = 'block';
        return;
      }

      // Try to log in first
      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (!error) {

      // Successful login
        localStorage.setItem('studentName', name);

        window.location.href = 'index.html';
        return;
      }

      // If login failed, try to create a new account
       
      const { data: signUpData, error: signUpError } =
          await supabaseClient.auth.signUp({
              email: email,
              password: password,
              options: {
                  data: {
                      name: name
                  }
              }
          });

      if (signUpError) {

          errorMsg.textContent =
              'Login failed. If you already have an account, check your email and password.';

          errorMsg.style.display = 'block';
          return;
      }

      alert(
          'Account created! Please check your email and click the confirmation link before logging in.'
      );

      return;

      if (signUpError) {

        errorMsg.textContent =
          'Login failed. Please check your email and password.';

        errorMsg.style.display = 'block';
        return;
      }

      
    
  </script>
</body>
</html>
