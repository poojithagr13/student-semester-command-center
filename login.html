<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="login-page">

        <section class="login-box">

            <h1>Student Semester Command Center</h1>

            <p>
                Sign in to access your academic dashboard.
            </p>


            <!-- Login Form -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <div class="form-group">

                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    autocomplete="name"
                >

            </div>


            <button
                class="login-btn"
                onclick="login()"
            >
                Login
            </button>


            <p
                id="message"
                class="error"
            ></p>

        </section>

    </main>


    <script>

        /* ==========================================
           SUPABASE
           ========================================== */

        const SUPABASE_URL =
            "https://bjfccfveekebgbkqreyp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           LOGIN
           ========================================== */

        async function login() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const studentName =
                document
                    .getElementById("studentName")
                    .value
                    .trim();


            const message =
                document.getElementById(
                    "message"
                );


            message.textContent = "";


            if (!email || !password || !studentName) {

                message.textContent =
                    "Please enter your email, password and name.";

                return;
            }


            const {
                data,
                error
            } = await supabaseClient.auth
                .signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                message.textContent =
                    "Login failed. Please check your email and password.";

                console.error(
                    "Login error:",
                    error
                );

                return;
            }


            /* Save student name for dashboard */

            localStorage.setItem(
                "studentName",
                studentName
            );


            /* Open dashboard */

            window.location.href =
                "index.html";

        }


        /* ==========================================
           ENTER KEY LOGIN
           ========================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    login();

                }

            }
        );

    </script>

</body>

</html>
