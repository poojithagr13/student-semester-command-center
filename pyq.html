<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Previous Year Questions | Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="container">

        <!-- Back to Subject -->
        <a href="#" id="backLink" class="back-link">
            ← Back to Subject
        </a>


        <!-- Page Header -->
        <h1 id="subjectTitle">
            Previous Year Questions
        </h1>

        <p class="subtitle">
            Practice previous year question papers for this subject.
        </p>


        <!-- Add PYQ -->
        <div class="add-form">

            <h2>Add Question Paper</h2>

            <div class="form-group">

                <label for="title">
                    Paper Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Example: End Semester Examination"
                >

            </div>


            <div class="form-group">

                <label for="year">
                    Year
                </label>

                <input
                    type="number"
                    id="year"
                    placeholder="Example: 2025"
                    min="1900"
                    max="2100"
                >

            </div>


            <div class="form-group">

                <label for="details">
                    Details
                </label>

                <textarea
                    id="details"
                    placeholder="Enter any useful details about this question paper"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="file">
                    Question Paper
                </label>

                <input
                    type="file"
                    id="file"
                    accept=".pdf,image/*"
                >

            </div>


            <button onclick="addPYQ()">
                Add Question Paper
            </button>

        </div>


        <!-- PYQ List -->
        <section>

            <h2>Available Question Papers</h2>

            <div
                id="pyqList"
                class="resource-list"
            ></div>

        </section>

    </main>


    <script>

        /* ==========================================
           SUPABASE
           ========================================== */

        const SUPABASE_URL =
            "https://bjfccfveekebgbkqreyp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           GET SUBJECT
           ========================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const subject =
            params.get("name");


        const subjectTitle =
            document.getElementById("subjectTitle");


        if (subject) {

            subjectTitle.textContent =
                subject + " — Previous Year Questions";

        } else {

            subjectTitle.textContent =
                "Previous Year Questions";

        }


        /* ==========================================
           BACK LINK
           ========================================== */

        const backLink =
            document.getElementById("backLink");


        if (subject) {

            backLink.href =
                "subject-details.html?name=" +
                encodeURIComponent(subject);

        } else {

            backLink.href =
                "subjects.html";

        }


        /* ==========================================
           ADD PYQ
           ========================================== */

        async function addPYQ() {

            if (!subject) {

                alert(
                    "No subject was selected."
                );

                return;
            }


            const title =
                document
                    .getElementById("title")
                    .value
                    .trim();


            const year =
                document
                    .getElementById("year")
                    .value
                    .trim();


            const details =
                document
                    .getElementById("details")
                    .value
                    .trim();


            const fileInput =
                document.getElementById("file");


            const file =
                fileInput.files[0];


            if (!title || !year || !details || !file) {

                alert(
                    "Please fill in all fields and select a file."
                );

                return;
            }


            /* ------------------------------------------
               Upload file
               ------------------------------------------ */

            const fileName =
                Date.now() +
                "_" +
                file.name;


            const {
                error: uploadError
            } = await supabaseClient
                .storage
                .from("pyq-files")
                .upload(
                    fileName,
                    file
                );


            if (uploadError) {

                console.error(
                    "File upload error:",
                    uploadError
                );

                alert(
                    "Unable to upload the question paper."
                );

                return;
            }


            /* ------------------------------------------
               Get public URL
               ------------------------------------------ */

            const {
                data: publicData
            } = supabaseClient
                .storage
                .from("pyq-files")
                .getPublicUrl(fileName);


            const fileUrl =
                publicData.publicUrl;


            /* ------------------------------------------
               Save PYQ
               ------------------------------------------ */

            const {
                error: insertError
            } = await supabaseClient
                .from("pyqs")
                .insert([
                    {
                        subject: subject,
                        title: title,
                        year: parseInt(year),
                        details: details,
                        file_url: fileUrl
                    }
                ]);


            if (insertError) {

                console.error(
                    "Database error:",
                    insertError
                );

                alert(
                    "File uploaded, but the question paper could not be saved."
                );

                return;
            }


            alert(
                "Question paper added successfully."
            );


            /* Clear form */

            document.getElementById(
                "title"
            ).value = "";


            document.getElementById(
                "year"
            ).value = "";


            document.getElementById(
                "details"
            ).value = "";


            fileInput.value = "";


            loadPYQs();

        }


        /* ==========================================
           LOAD PYQs
           ========================================== */

        async function loadPYQs() {

            if (!subject) {

                document.getElementById(
                    "pyqList"
                ).innerHTML = `
                    <div class="empty-message">
                        No subject selected.
                    </div>
                `;

                return;
            }


            const {
                data,
                error
            } = await supabaseClient
                .from("pyqs")
                .select("*")
                .eq("subject", subject)
                .order(
                    "year",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Error loading question papers:",
                    error
                );

                document.getElementById(
                    "pyqList"
                ).innerHTML = `
                    <div class="empty-message">
                        Unable to load question papers.
                    </div>
                `;

                return;
            }


            const pyqList =
                document.getElementById(
                    "pyqList"
                );


            pyqList.innerHTML = "";


            if (!data || data.length === 0) {

                pyqList.innerHTML = `
                    <div class="empty-message">
                        No question papers available for this subject yet.
                    </div>
                `;

                return;
            }


            data.forEach(paper => {

                const card =
                    document.createElement("div");

                card.className =
                    "resource-card";


                const title =
                    document.createElement("h3");

                title.textContent =
                    paper.title;


                const year =
                    document.createElement("p");

                year.innerHTML =
                    "<strong>Year:</strong> " +
                    String(paper.year);


                const details =
                    document.createElement("p");

                details.textContent =
                    paper.details ||
                    "No additional details provided.";


                const fileLink =
                    document.createElement("a");

                fileLink.href =
                    paper.file_url;

                fileLink.target =
                    "_blank";

                fileLink.rel =
                    "noopener noreferrer";

                fileLink.textContent =
                    "Open Question Paper";


                card.appendChild(title);
                card.appendChild(year);
                card.appendChild(details);
                card.appendChild(fileLink);


                pyqList.appendChild(card);

            });

        }


        /* ==========================================
           INITIAL LOAD
           ========================================== */

        loadPYQs();

    </script>

</body>

</html>
