<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="login-page">

        <section class="login-box">

            <h1>Reset Password</h1>

            <p>
                Enter a new password for your Student Semester Command Center account.
            </p>


            <!-- New Password -->

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    autocomplete="new-password"
                >

            </div>


            <!-- Reset Button -->

            <button
                type="button"
                class="login-btn"
                onclick="updatePassword()"
            >
                Update Password
            </button>


            <!-- Back to Login -->

            <button
                type="button"
                class="login-btn secondary-btn"
                onclick="window.location.href='login.html'"
                style="margin-top: 10px;"
            >
                Back to Login
            </button>


            <!-- Message -->

            <p
                id="message"
                class="error"
                aria-live="polite"
            ></p>

        </section>

    </main>


    <script>

        /* ==========================================
           SUPABASE CONFIGURATION
           ========================================== */

        const SUPABASE_URL =
            "https://bjfccfveekebgbkqreyp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           SHOW MESSAGE
           ========================================== */

        function showMessage(message, type = "error") {

            const messageElement =
                document.getElementById("message");

            messageElement.textContent =
                message;

            messageElement.className =
                type === "success"
                    ? "success-message"
                    : "error";

        }


        /* ==========================================
           CHECK PASSWORD RECOVERY SESSION
           ========================================== */

        supabaseClient.auth.onAuthStateChange(
            async function (event, session) {

                console.log(
                    "Auth event:",
                    event
                );


                if (
                    event === "PASSWORD_RECOVERY" &&
                    session
                ) {

                    showMessage(
                        "Please enter your new password.",
                        "success"
                    );

                    return;
                }

            }
        );


        /* ==========================================
           UPDATE PASSWORD
           ========================================== */

        async function updatePassword() {

            const newPassword =
                document
                    .getElementById("newPassword")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            /* Check fields */

            if (!newPassword || !confirmPassword) {

                showMessage(
                    "Please enter and confirm your new password."
                );

                return;
            }


            /* Check password length */

            if (newPassword.length < 6) {

                showMessage(
                    "Password must be at least 6 characters."
                );

                return;
            }


            /* Check passwords match */

            if (newPassword !== confirmPassword) {

                showMessage(
                    "Passwords do not match."
                );

                return;
            }


            showMessage(
                "Updating your password...",
                "success"
            );


            /* Update password in Supabase */

            const {
                error
            } = await supabaseClient.auth
                .updateUser({
                    password: newPassword
                });


            if (error) {

                console.error(
                    "Password update error:",
                    error
                );


                showMessage(
                    "Password update failed. Please request a new password reset email and try again."
                );

                return;
            }


            /* Success */

            showMessage(
                "Password updated successfully. Redirecting to login...",
                "success"
            );


            /* Sign out recovery session */

            await supabaseClient.auth.signOut();


            /* Go back to login */

            setTimeout(
                function () {

                    window.location.href =
                        "login.html";

                },
                1500
            );

        }


        /* ==========================================
           ENTER KEY SUPPORT
           ========================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    document.activeElement.tagName !== "BUTTON"
                ) {

                    updatePassword();

                }

            }
        );

    </script>

</body>

</html>
