<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="login-page">

        <section class="login-box">

            <h1>Student Semester Command Center</h1>

            <p>
                Sign in or create an account to access your academic dashboard.
            </p>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <!-- Student Name -->

            <div class="form-group">

                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    autocomplete="name"
                >

            </div>


            <!-- Login Button -->

            <button
                type="button"
                class="login-btn"
                onclick="login()"
            >
                Login
            </button>


            <!-- Create Account Button -->

            <button
                type="button"
                class="login-btn secondary-btn"
                onclick="createAccount()"
                style="margin-top: 10px;"
            >
                Create New Account
            </button>


            <!-- Forgot Password -->

            <button
                type="button"
                class="forgot-password-btn"
                onclick="forgotPassword()"
            >
                Forgot Password?
            </button>


            <!-- Message -->

            <p
                id="message"
                class="error"
                aria-live="polite"
            ></p>

        </section>

    </main>


    <script>

        /* ==========================================
           SUPABASE CONFIGURATION
           ========================================== */

        const SUPABASE_URL =
            "https://bjfccfveekebgbkqreyp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           GET FORM VALUES
           ========================================== */

        function getFormValues() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const studentName =
                document
                    .getElementById("studentName")
                    .value
                    .trim();

            return {
                email,
                password,
                studentName
            };

        }


        /* ==========================================
           SHOW MESSAGE
           ========================================== */

        function showMessage(message, type = "error") {

            const messageElement =
                document.getElementById("message");

            messageElement.textContent =
                message;

            messageElement.className =
                type === "success"
                    ? "success-message"
                    : "error";

        }


        /* ==========================================
           LOGIN EXISTING ACCOUNT
           ========================================== */

        async function login() {

            const {
                email,
                password,
                studentName
            } = getFormValues();


            if (!email || !password || !studentName) {

                showMessage(
                    "Please enter your email, password and name."
                );

                return;
            }


            showMessage(
                "Signing in...",
                "success"
            );


            const {
                data,
                error
            } = await supabaseClient.auth
                .signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error(
                    "Login error:",
                    error
                );

                showMessage(
                    "Login failed. Please check your email and password."
                );

                return;
            }


            /* Save student name locally */

            localStorage.setItem(
                "studentName",
                studentName
            );


            /* Open dashboard */

            window.location.href =
                "index.html";

        }


        /* ==========================================
           CREATE NEW ACCOUNT
           ========================================== */

        async function createAccount() {

            const {
                email,
                password,
                studentName
            } = getFormValues();


            if (!email || !password || !studentName) {

                showMessage(
                    "Please enter your email, password and name."
                );

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "Password must be at least 6 characters."
                );

                return;
            }


            showMessage(
                "Creating your account...",
                "success"
            );


            const {
                data,
                error
            } = await supabaseClient.auth
                .signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            student_name: studentName
                        }
                    }
                });


            if (error) {

                console.error(
                    "Account creation error:",
                    error
                );


                showMessage(
                    error.message
                );

                return;
            }


            /*
             * Supabase may require email confirmation.
             * If confirmation is enabled, session will be null.
             */

            if (!data.session) {

                showMessage(
                    "Account created. Please check your email and confirm your account before logging in.",
                    "success"
                );

                return;
            }


            /* Save student name locally */

            localStorage.setItem(
                "studentName",
                studentName
            );


            /* Open dashboard */

            window.location.href =
                "index.html";

        }


        /* ==========================================
           FORGOT PASSWORD
           ========================================== */

        async function forgotPassword() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            if (!email) {

                showMessage(
                    "Please enter your email address first."
                );

                return;
            }


            showMessage(
                "Sending password reset email...",
                "success"
            );


            /*
             * After clicking the reset link,
             * Supabase will return the user to
             * reset-password.html.
             */

            const resetPage =
                window.location.origin +
                window.location.pathname.replace(
                    "login.html",
                    "reset-password.html"
                );


            const {
                error
            } = await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo: resetPage
                    }
                );


            if (error) {

                console.error(
                    "Password reset error:",
                    error
                );

                showMessage(
                    "Unable to send the password reset email. Please check the email address and try again."
                );

                return;
            }


            showMessage(
                "Password reset email sent. Please check your inbox and follow the instructions.",
                "success"
            );

        }


        /* ==========================================
           ENTER KEY SUPPORT
           ========================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    document.activeElement.tagName !== "BUTTON"
                ) {

                    login();

                }

            }
        );

    </script>


    <!-- ==========================================
         FORGOT PASSWORD BUTTON STYLE
         ========================================== -->

    <style>

        .forgot-password-btn {

            display: block;

            margin: 14px auto 0;

            border: none;

            background: transparent;

            color: #005599;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            padding: 5px 8px;

        }


        .forgot-password-btn:hover {

            color: #0066CC;

            text-decoration: underline;

        }

    </style>

</body>

</html>
