<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Textbooks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .back-link {
            text-decoration: none;
            color: #2563eb;
        }

        h1 {
            text-align: center;
        }

        #subjectName {
            text-align: center;
            color: #555;
        }

        .textbook-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .textbook-card h3 {
            margin-bottom: 8px;
        }

        .textbook-card p {
            margin: 6px 0;
        }

        .add-button {
            display: block;
            margin: 20px auto;
            padding: 10px 18px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="container">

        <a href="javascript:history.back()" class="back-link">
            ← Back
        </a>

        <h1>📚 Textbooks</h1>

        <h2 id="subjectName">Loading subject...</h2>

        <button class="add-button" onclick="showAddForm()">
            ➕ Add Textbook
        </button>

        <div id="addForm" style="display: none;">

            <h3>Add a Textbook</h3>

            <label>Textbook Name:</label>
            <input type="text" id="bookTitle">

            <br><br>

            <label>Author:</label>
            <input type="text" id="bookAuthor">

            <br><br>

            <label>Textbook Link:</label>
            <input type="url" id="bookLink">

            <br><br>

            <button onclick="addTextbook()">
                Save Textbook
            </button>

        </div>

        <hr>

        <div id="textbookList">
            <p>Textbooks will appear here.</p>
        </div>

    </div>

    <script>

        const urlParams = new URLSearchParams(
            window.location.search
        );

        const subject =
            urlParams.get("name") || "Unknown Subject";

        document.getElementById("subjectName").textContent =
            subject;

        function showAddForm() {

            document.getElementById("addForm").style.display =
                "block";

        }
        async function addTextbook() {

            const title = document.getElementById("bookTitle").value;
            const author = document.getElementById("bookAuthor").value;
            const link = document.getElementById("bookLink").value;

             if (title === "" || author === "") {
                alert("Please enter textbook name and author.");
                return;
            }
            const { error } = await supabaseClient
                 .from("textbooks")
                .insert([
                    {
                        subject: subject,
                        title: title,
                        author: author,
                        file_url: link
                    }
                ]);

            if (error) {
                alert("Error saving textbook: " + error.message);
                return;
            }
            alert("Textbook added successfully!");

            location.reload();

        }
        
        const SUPABASE_URL =
            "https://bjfccfveekebgbkqreyp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );
            async function loadTextbooks() {

                const { data, error } = await supabaseClient
                    .from("textbooks")
                    .select("*")
                    .eq("subject", subject);

                if (error) {
                console.error(error);
                    return;
                }

                const textbookList = document.getElementById("textbookList");

                textbookList.innerHTML = "";

                if (data.length === 0) {
                    textbookList.innerHTML = "<p>No textbooks added yet.</p>";
                    return;
                }

                data.forEach(book => {

                    const card = document.createElement("div");

                    card.className = "textbook-card";

                    card.innerHTML = `
                        <h3>${book.title}</h3>
                        <p><strong>Author:</strong> ${book.author}</p>
                        <p>
                            <a href="${book.file_url}" target="_blank">
                                Open Textbook
                            </a>
                        </p>
                    `;

            textbookList.appendChild(card);

                });

            }

            loadTextbooks();
    </script>

</body>
</html>
