<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Semester Command Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

    <h1>Student Semester Command Center</h1>

    <p>Welcome to your academic dashboard.</p>

    <div class="cards">
        <div class="card">
            <h2>📚 Subjects</h2>
            <p id="subjectCount">0</p>
            <button onclick="addSubject()">Add Subject</button>
        </div>
        
        <div class="card">
            <h2>📖 Topics</h2>
            <p>0</p>
        </div>

        <div class="card">
            <h2>📝 Questions</h2>
            <p>0</p>
        </div>

        <div class="card">
            <h2>📊 Overall Progress</h2>
            <p>0%</p>
        </div>

    </div>

</div>
<script>
    function addSubject() {
        const subject = prompt("Enter your subject name:");
    
        if (subject) {
            const count = document.getElementById("subjectCount");
            count.textContent = parseInt(count.textContent) + 1;
        }
    }
    </script>
</body>
</html>
