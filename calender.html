<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Calendar - Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <h1>📅 College Calendar</h1>
        <p>Official college events, exams, holidays and important dates.</p>
    </header>

    <main>

        <section class="calendar-container">

            <h2>🏫 Official College Events</h2>

            
                    

            <div id="examList">
                <p>No exams added yet.</p>
            </div>

        </section>

    </main>

    <script>
const SUPABASE_URL = "https://bjfccfveekebgbkqreyp.supabase.co";
const SUPABASE_KEY = "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
const examList = document.getElementById("examList");


// Load official college events
async function loadCollegeEvents() {

    const { data, error } = await supabaseClient
        .from("college_events")
        .select("*")
        .order("event_date", { ascending: true });

    if (error) {
        console.error("Error loading college events:", error);
        examList.innerHTML =
            "<p>Could not load college events.</p>";
        return;
    }

    displayCollegeEvents(data || []);
}


// Calculate days remaining
function getDaysRemaining(eventDate) {

    const today = new Date();

    today.setHours(0, 0, 0, 0);

    const event = new Date(eventDate + "T00:00:00");

    const difference =
        event.getTime() - today.getTime();

    return Math.ceil(
        difference / (1000 * 60 * 60 * 24)
    );
}


// Format the date nicely
function formatDate(dateString) {

    const date = new Date(dateString + "T00:00:00");

    return date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}


// Display college events
function displayCollegeEvents(events) {

    if (events.length === 0) {

        examList.innerHTML =
            "<p>No college events have been added yet.</p>";

        return;
    }

    examList.innerHTML = "";

    events.forEach(function (event) {

        const daysLeft =
            getDaysRemaining(event.event_date);

        let countdownText = "";

        if (daysLeft > 1) {
            countdownText = daysLeft + " days left";
        }
        else if (daysLeft === 1) {
            countdownText = "1 day left";
        }
        else if (daysLeft === 0) {
            countdownText = "🎉 TODAY";
        }
        else if (daysLeft === -1) {
            countdownText = "Event was yesterday";
        }
        else {
            countdownText =
                "Event completed";
        }

        const eventItem =
            document.createElement("div");

        eventItem.className = "exam-item";

        eventItem.innerHTML = `
            <div style="
                padding: 15px;
                margin-bottom: 15px;
                border: 1px solid #ccc;
                border-radius: 8px;
            ">

                <strong style="font-size: 20px;">
                    🏫 ${escapeHTML(event.title)}
                </strong>

                <p>
                    📅 ${formatDate(event.event_date)}
                </p>

                <p>
                    🎯 ${escapeHTML(event.event_type)}
                </p>

                <p>
                    ⏳ <strong>${countdownText}</strong>
                </p>

                ${
                    event.description
                    ? `<p>${escapeHTML(event.description)}</p>`
                    : ""
                }

            </div>
        `;

        examList.appendChild(eventItem);

    });
}


// Protect text displayed on the page
function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// Load events when page opens
loadCollegeEvents();
</script>



</body>
</html>
