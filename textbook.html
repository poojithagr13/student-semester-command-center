<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Textbooks | Student Semester Command Center</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="container">

        <!-- Back to Subject -->
        <a href="#" id="backLink" class="back-link">
            ← Back to Subject
        </a>


        <!-- Page Header -->
        <h1 id="subjectTitle">
            Textbooks
        </h1>

        <p class="subtitle">
            View the textbooks available for this subject.
        </p>


        <!-- Add Textbook -->
        <div class="add-form">

            <h2>Add Textbook</h2>

            <p>
                Add a textbook with its title, author and reference link.
            </p>

            <div class="form-group">

                <label for="title">
                    Book Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter textbook title"
                >

            </div>


            <div class="form-group">

                <label for="author">
                    Author
                </label>

                <input
                    type="text"
                    id="author"
                    placeholder="Enter author name"
                >

            </div>


            <div class="form-group">

                <label for="link">
                    Book Link
                </label>

                <input
                    type="url"
                    id="link"
                    placeholder="https://example.com"
                >

            </div>


            <div class="form-actions">

                <button onclick="addTextbook()">
                    Add Textbook
                </button>

                <button
                    type="button"
                    class="secondary-btn"
                    onclick="hideAddForm()"
                >
                    Cancel
                </button>

            </div>

        </div>


        <!-- Textbook List -->
        <section>

            <h2>Available Textbooks</h2>

            <div
                id="textbookList"
                class="resource-list"
            ></div>

        </section>

    </main>


    <script>

        /* ==========================================
           SUPABASE
           ========================================== */

        const SUPABASE_URL =
            "https://bjfccfveekebgbkqreyp.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X9kztDgnl8G2lbJFT-3gJw_4fVkRHeQ";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==========================================
           GET SUBJECT
           ========================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const subject =
            params.get("name");


        const subjectTitle =
            document.getElementById("subjectTitle");


        if (subject) {

            subjectTitle.textContent =
                subject + " — Textbooks";

        } else {

            subjectTitle.textContent =
                "Textbooks";

        }


        /* ==========================================
           BACK LINK
           ========================================== */

        const backLink =
            document.getElementById("backLink");


        if (subject) {

            backLink.href =
                "subject-details.html?name=" +
                encodeURIComponent(subject);

        } else {

            backLink.href =
                "subjects.html";

        }


        /* ==========================================
           ADD FORM
           ========================================== */

        function hideAddForm() {

            document.getElementById("title").value = "";
            document.getElementById("author").value = "";
            document.getElementById("link").value = "";

        }


        /* ==========================================
           ADD TEXTBOOK
           ========================================== */

        async function addTextbook() {

            if (!subject) {

                alert(
                    "No subject was selected."
                );

                return;
            }


            const title =
                document
                    .getElementById("title")
                    .value
                    .trim();


            const author =
                document
                    .getElementById("author")
                    .value
                    .trim();


            const link =
                document
                    .getElementById("link")
                    .value
                    .trim();


            if (!title || !author || !link) {

                alert(
                    "Please fill in all fields."
                );

                return;
            }


            const {
                error
            } = await supabaseClient
                .from("textbooks")
                .insert([
                    {
                        subject: subject,
                        title: title,
                        author: author,
                        file_url: link
                    }
                ]);


            if (error) {

                console.error(
                    "Error adding textbook:",
                    error
                );

                alert(
                    "Unable to add textbook."
                );

                return;
            }


            alert(
                "Textbook added successfully."
            );


            hideAddForm();


            loadTextbooks();

        }


        /* ==========================================
           LOAD TEXTBOOKS
           ========================================== */

        async function loadTextbooks() {

            if (!subject) {

                document.getElementById(
                    "textbookList"
                ).innerHTML = `
                    <div class="empty-message">
                        No subject selected.
                    </div>
                `;

                return;
            }


            const {
                data,
                error
            } = await supabaseClient
                .from("textbooks")
                .select("*")
                .eq("subject", subject);


            if (error) {

                console.error(
                    "Error loading textbooks:",
                    error
                );

                document.getElementById(
                    "textbookList"
                ).innerHTML = `
                    <div class="empty-message">
                        Unable to load textbooks.
                    </div>
                `;

                return;
            }


            const textbookList =
                document.getElementById(
                    "textbookList"
                );


            textbookList.innerHTML = "";


            if (!data || data.length === 0) {

                textbookList.innerHTML = `
                    <div class="empty-message">
                        No textbooks available for this subject yet.
                    </div>
                `;

                return;
            }


            data.forEach(book => {

                const card =
                    document.createElement("div");

                card.className =
                    "resource-card";


                const title =
                    document.createElement("h3");

                title.textContent =
                    book.title;


                const author =
                    document.createElement("p");

                author.innerHTML =
                    "<strong>Author:</strong> " +
                    escapeHTML(
                        book.author || "Not specified"
                    );


                const link =
                    document.createElement("a");

                link.href =
                    book.file_url;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.textContent =
                    "Open Book Link";


                card.appendChild(title);
                card.appendChild(author);
                card.appendChild(link);


                textbookList.appendChild(card);

            });

        }


        /* ==========================================
           ESCAPE HTML
           ========================================== */

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value;

            return div.innerHTML;

        }


        /* ==========================================
           INITIAL LOAD
           ========================================== */

        loadTextbooks();

    </script>

</body>

</html>
